]],[[451.72071,12.19548],[14.49962,0],[-28.19774,0]],[[367.12746,12.19116],[28.19773,0.01748],[-8.22857,0.6776]],[[340.85232,19.44341],[6.63206,-5.76989],[-18.7984,16.35462]],[[319.07033,81.90217],[1.58516,-23.26424],[-1.13155,16.60698]],[[316.47283,131.13547],[0,-16.71384],[0,20.73278]],[[312.55272,192.70221],[1.03215,-20.641],[-1.02218,20.44151]]],&quot;closed&quot;:true}]}" fill="#ffffff" stroke="none" stroke-width="0.5"/><text transform="translate(140.78335,96.10001) scale(0.15156,0.15156)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Curly" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">La umbra nucului batran doi tractoristi se caca</tspan><tspan x="0" dy="48px">Se sterg cu bastile la cur, le pun in cap si pleaca</tspan><tspan x="0" dy="48px">Ma cacai in fundu curtii cum pica lamaia</tspan><tspan x="0" dy="48px">Pai si cu-n somoiag de paie ma loa de maa stergea Maria</tspan><tspan x="0" dy="48px">Cateaua vecinilor, ma latra de zor</tspan><tspan x="0" dy="48px">Pai si-am stigat la Maria: "Da fa in catea"</tspan><tspan x="0" dy="48px">Dar cand ma uitam mai bn, se caca si ea</tspan><tspan x="0" dy="48px">Ca sa e viata la tara, sa stie lumea</tspan><tspan x="0" dy="48px">Pai ca-ti vine cateodata mai, tata...Sa te caci in ea</tspan><tspan x="0" dy="48px">Si-a venit vecini toti...toti vecini toti</tspan><tspan x="0" dy="48px">Ca sa vada-n fundu curtii doi cacati cu moti</tspan><tspan x="0" dy="48px">Hai sa ne cacam in ploaie, vantu se ne sufle-n cur,iarba sa ne scarpine la coaie,</tspan><tspan x="0" dy="48px">Hai sa ne cacam in drum</tspan><tspan x="0" dy="48px">De s-ar semana si aia cum se seamana pastaia ai vedea pe aratura numai capete de sfecla</tspan><tspan x="0" dy="48px">Si-ai vedea femeile ridicandu-si fustele cautand pe aratura cel mai mare cap de sfecla</tspan><tspan x="0" dy="48px">Si-ai vedea si vobile ridicandu-si polile caudand pe aratura creponatul cap de sfecla</tspan><tspan x="0" dy="48px"> </tspan></text><path d="M130.174,202.0104c0.22398,-0.05774 0.47683,-0.09033 0.76227,-0.09033c2.5,0 2.5,2.5 2.5,2.5c0,6.71233 0.65318,13.10325 0.8922,19.68204c0.28358,-0.31996 0.56244,-0.64242 0.81803,-0.97773c2.73343,-3.58612 5.88395,-10.49306 10.782,-11.65611c3.14174,-0.74601 6.45068,0.31243 9.67699,0.44687c7.04591,0.29359 13.71161,0.71803 20.73175,1.46921c11.61329,1.24266 23.32551,0.86635 34.92865,2.12898c12.6286,1.37835 25.28499,1.36039 37.92113,2.3951c3.4079,0.27905 6.68492,1.44527 10.04438,2.08218c3.92266,0.74368 8.39526,1.03236 12.3978,1.17562c11.66405,0.4175 23.43176,-0.00283 35.10289,-0.00283c13.47974,0 26.76251,-0.58346 40.06172,-2.57942c7.02612,-1.05448 15.6561,-2.41649 21.27407,-7.26518c4.66906,-4.02971 6.21052,-8.79116 8.40089,-14.28177c0.75258,-2.25445 1.8532,-4.38648 2.54816,-6.65936c0.42539,-1.39126 0.23484,-6.69502 0.23473,-6.93933c-0.00246,-5 0,-10.00001 0,-15c0,-6.02359 0.95484,-12.94076 0.02779,-18.88306c-0.49005,-3.14114 -1.83993,-6.11668 -2.24076,-9.27045c-1.02287,-8.04814 -0.83681,-16.27945 -5.01908,-23.56626c-3.05697,-6.97218 -8.46587,-10.63566 -15.54114,-13.11554c-2.49525,-0.87458 -5.22011,-1.02783 -7.67028,-2.02172c-14.00331,-5.68032 -28.38518,-9.63586 -43.37012,-12.01013c-18.72482,-1.14048 -37.51035,-3.32226 -56.09924,-5.74889c-5.11044,-0.66712 -10.21456,-0.62941 -15.32727,-1.26437c-4.06641,-0.3014 -8.01199,-0.85496 -12.02389,-1.3394c-7.19516,-0.86881 -14.98229,-0.31123 -22.2321,-0.31123c-14.09887,0 -28.19776,0.00658 -42.29663,-0.00216c-4.11428,0.3388 -9.82154,0.74118 -13.13757,3.62613c-9.3992,8.17731 -10.09842,19.59726 -10.891,31.22938c-0.56578,8.30349 -1.29875,16.25973 -1.29875,24.61665c0,10.36639 -1.44398,20.46287 -1.96005,30.78337c-0.51109,10.22075 -0.01862,20.60668 0.00241,30.84976zM128.46024,206.70777c-0.2297,0.06155 -0.49018,0.09645 -0.78555,0.09645c-2.5,0 -2.5,-2.5 -2.